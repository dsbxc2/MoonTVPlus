name: Auto Sync Upstream

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时自动检测一次
  workflow_dispatch: # 允许手动点击运行

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 1. 切换到最新支持 Node 24 的 checkout 插件
      - name: Checkout target repo
        uses: actions/checkout@v4

      # 2. 直接使用 GitHub 官方的基建进行上游同步（不再依赖第三方容易变动参数的插件）
      - name: Sync Upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 配置本地 Git 用户信息（用于合并时的签名）
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 添加原作者的仓库作为远程上游 (upstream)
          git remote add upstream https://github.com/mtvpls/MoonTVPlus.git
          
          # 获取原作者的最新的分支数据
          git fetch upstream main
          
          # 切换并确保在自己的 main 分支
          git checkout main
          
          # 将原作者的最新代码合并（或者 rebase）到你的分支
          # 这里采用 rebase 保持提交历史干净，如果没有冲突会自动完成
          git rebase upstream/main
          
          # 推送回你自己的 GitHub 仓库
          git push origin main --force-with-lease
